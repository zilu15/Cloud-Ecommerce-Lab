<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CloudShop - Microservices</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>CloudShop</h1>

        <nav>
            <a href="#products">Products</a>
            <a href="#cart">
                Cart (<span id="cart-count">0</span>)
            </a>
        </nav>
    </header>

    <main>

        <!-- Products Section -->
        <section id="products">

            <h2>Our Products</h2>

            <div id="product-list" class="product-container">
                <!-- Products loaded from Product Service -->
            </div>

        </section>

        <!-- Cart Section -->
        <section id="cart">

            <h2>Shopping Cart</h2>

            <div id="cart-items">
                <p>Your cart is empty.</p>
            </div>

            <h3>
                Total: ₹<span id="cart-total">0</span>
            </h3>

            <button onclick="checkout()">
                Checkout
            </button>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
