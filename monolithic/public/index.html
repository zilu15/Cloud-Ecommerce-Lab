<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CloudShop - E-Commerce</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>CloudShop</h1>

        <nav>
            <a href="#products">Products</a>
            <a href="#cart">Cart (<span id="cart-count">0</span>)</a>
        </nav>
    </header>


    <!-- Products -->
    <main>

        <section id="products">

            <h2>Our Products</h2>

            <div id="product-list" class="product-container">

                <!-- Products will be loaded using JavaScript -->

            </div>

        </section>


        <!-- Cart -->
        <section id="cart">

            <h2>Shopping Cart</h2>

            <div id="cart-items">

                <p>Your cart is empty.</p>

            </div>

            <h3>
                Total: ₹<span id="cart-total">0</span>
            </h3>

            <button onclick="checkout()">
                Checkout
            </button>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
